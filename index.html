<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>細胞数計算機</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="細胞数計算" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #047857;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 1.45rem;
      letter-spacing: .02em;
    }
    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .92rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin: 12px 0;
    }
    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 6px;
      font-size: .95rem;
    }
    .hint {
      display: block;
      color: var(--muted);
      font-weight: 500;
      font-size: .78rem;
      margin-top: 2px;
    }
    input {
      width: 100%;
      font-size: 1.35rem;
      padding: 12px 13px;
      border: 1px solid #cfd5df;
      border-radius: 14px;
      background: #fff;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      border: 1px solid var(--line);
      background: #f9fafb;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: .95rem;
    }
    button:active {
      transform: translateY(1px);
    }
    .primary {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 1.05rem;
    }
    .result {
      display: grid;
      gap: 10px;
    }
    .big {
      border-radius: 16px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }
    .big .name {
      color: var(--muted);
      font-weight: 700;
      font-size: .92rem;
    }
    .big .value {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 2px;
    }
    .value small {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 700;
    }
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .mini {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: .92rem;
    }
    .mini div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .warn {
      color: var(--danger);
      font-weight: 800;
      margin-top: 10px;
    }
    .ok {
      color: var(--ok);
      font-weight: 800;
      margin-top: 10px;
    }
    .formula {
      font-size: .88rem;
      color: var(--muted);
    }
    @media (max-width: 430px) {
      main { padding: 12px; }
      .grid, .two { grid-template-columns: 1fr; }
      .big .value { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>細胞数計算機</h1>
    <p class="sub">目標細胞数は「×10⁴ cells/well」で入力。例：0.6、3、6、60</p>

    <section class="card">
      <label for="count">
        カウント値
        <span class="hint">ExcelのSheet2で入れているカウント値。例：70</span>
      </label>
      <input id="count" type="number" inputmode="decimal" step="0.1" placeholder="例：70" autofocus />

      <label for="target">
        目標細胞数
        <span class="hint">単位：×10⁴ cells/well。60000 cells/wellなら 6</span>
      </label>
      <input id="target" type="number" inputmode="decimal" step="0.1" value="6" />
      <div class="presets">
        <button type="button" data-target="0.6">0.6</button>
        <button type="button" data-target="1">1</button>
        <button type="button" data-target="2">2</button>
        <button type="button" data-target="3">3</button>
        <button type="button" data-target="6">6</button>
        <button type="button" data-target="60">60</button>
      </div>

      <div class="grid">
        <div>
          <label for="well">
            分注量
            <span class="hint">µL/well</span>
          </label>
          <input id="well" type="number" inputmode="decimal" step="1" value="200" />
        </div>
        <div>
          <label for="total">
            作成総量
            <span class="hint">µL</span>
          </label>
          <input id="total" type="number" inputmode="decimal" step="1" value="4000" />
        </div>
      </div>

      <details style="margin-top: 10px;">
        <summary style="font-weight:700; color:#374151;">詳細設定</summary>
        <label for="factor">
          換算係数
          <span class="hint">通常は 50。懸濁液濃度 = カウント値 × 50 cells/µL</span>
        </label>
        <input id="factor" type="number" inputmode="decimal" step="1" value="50" />
      </details>

      <button class="primary" type="button" id="calc">計算</button>
    </section>

    <section class="card result" aria-live="polite">
      <div class="two">
        <div class="big">
          <div class="name">細胞懸濁液</div>
          <div class="value" id="cellVol">— <small>µL</small></div>
        </div>
        <div class="big">
          <div class="name">培地</div>
          <div class="value" id="mediumVol">— <small>µL</small></div>
        </div>
      </div>

      <div class="mini">
        <div><span>懸濁液濃度</span><strong id="stockConc">—</strong></div>
        <div><span>目標濃度</span><strong id="targetConc">—</strong></div>
        <div><span>作れるwell数</span><strong id="wells">—</strong></div>
        <div><span>目標細胞数</span><strong id="targetCells">—</strong></div>
      </div>

      <div id="message"></div>
    </section>

    <section class="card formula">
      <strong>計算式</strong><br>
      懸濁液濃度 = カウント値 × 50<br>
      目標濃度 = 目標細胞数 ÷ 分注量<br>
      細胞懸濁液量 = 作成総量 × 目標濃度 ÷ 懸濁液濃度
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function num(id) {
      const v = parseFloat($(id).value);
      return Number.isFinite(v) ? v : NaN;
    }

    function fmt(x, digits = 1) {
      if (!Number.isFinite(x)) return "—";
      if (Math.abs(x) >= 100) return Math.round(x).toLocaleString();
      return x.toLocaleString(undefined, { maximumFractionDigits: digits });
    }

    function calc() {
      const count = num("count");
      const targetX = num("target");
      const well = num("well");
      const total = num("total");
      const factor = num("factor");

      const message = $("message");
      message.innerHTML = "";

      if (![count, targetX, well, total, factor].every(v => Number.isFinite(v) && v > 0)) {
        $("cellVol").innerHTML = `— <small>µL</small>`;
        $("mediumVol").innerHTML = `— <small>µL</small>`;
        $("stockConc").textContent = "—";
        $("targetConc").textContent = "—";
        $("wells").textContent = "—";
        $("targetCells").textContent = "—";
        return;
      }

      const stockConc = count * factor;              // cells/µL
      const targetCells = targetX * 10000;           // cells/well
      const targetConc = targetCells / well;         // cells/µL
      const cellVol = total * targetConc / stockConc;
      const mediumVol = total - cellVol;
      const wells = total / well;

      $("cellVol").innerHTML = `${fmt(cellVol)} <small>µL</small>`;
      $("mediumVol").innerHTML = `${fmt(mediumVol)} <small>µL</small>`;
      $("stockConc").textContent = `${fmt(stockConc)} cells/µL`;
      $("targetConc").textContent = `${fmt(targetConc)} cells/µL`;
      $("wells").textContent = `${fmt(wells, 1)} wells`;
      $("targetCells").textContent = `${fmt(targetCells)} cells/well`;

      if (cellVol > total) {
        message.innerHTML = `<div class="warn">細胞懸濁液だけで総量を超えます。濃すぎる目標か、カウント値が低すぎます。</div>`;
      } else if (cellVol < 10) {
        message.innerHTML = `<div class="warn">細胞懸濁液量が10 µL未満です。ピペット誤差が大きくなりやすいです。</div>`;
      } else {
        message.innerHTML = `<div class="ok">この条件で調製できます。</div>`;
      }
    }

    ["count", "target", "well", "total", "factor"].forEach(id => {
      $(id).addEventListener("input", calc);
    });
    $("calc").addEventListener("click", calc);

    document.querySelectorAll("[data-target]").forEach(btn => {
      btn.addEventListener("click", () => {
        $("target").value = btn.dataset.target;
        calc();
      });
    });

    calc();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
